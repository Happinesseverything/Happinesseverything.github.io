<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>快捷键速查手册</title>
<style>
  :root {
    --blue: #185FA5;
    --blue-mid: #378ADD;
    --blue-bg: #E6F1FB;
    --blue-bg-soft: #F2F8FD;
    --page-bg: #F4F8FC;
    --card-border: rgba(24, 95, 165, 0.14);
    --text: #1F2937;
    --text-2: #5B6B7C;
    --mono: "SF Mono", Menlo, Consolas, "Courier New", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--sans);
    background: var(--page-bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.6;
  }

  /* ===== 顶部毛玻璃 ===== */
  header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(255, 255, 255, 0.78);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--card-border);
    padding: 16px 20px 12px;
  }
  .header-inner { max-width: 1100px; margin: 0 auto; }
  .title-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  h1 { font-size: 20px; font-weight: 600; color: var(--blue); letter-spacing: 0.5px; }
  .subtitle { font-size: 13px; color: var(--text-2); }
  .count-badge {
    font-size: 12px; background: var(--blue-bg); color: var(--blue);
    padding: 2px 10px; border-radius: 999px; font-weight: 500;
  }

  /* 搜索框 */
  .search-wrap { position: relative; margin-bottom: 10px; }
  .search-wrap svg {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; color: var(--blue-mid); pointer-events: none;
  }
  #search {
    width: 100%; padding: 11px 16px 11px 40px;
    border: 1px solid var(--card-border); border-radius: 12px;
    background: #fff; font-size: 14px; font-family: var(--sans); color: var(--text);
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  #search:focus { border-color: var(--blue-mid); box-shadow: 0 0 0 3px rgba(55,138,221,.15); }
  #search::placeholder { color: #9AA8B5; }

  /* 分类 chips */
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; font-size: 13px; padding: 6px 14px; border-radius: 999px;
    border: 1px solid var(--card-border); background: #fff; color: var(--text-2);
    cursor: pointer; user-select: none; transition: all .15s; font-family: var(--sans);
  }
  .chip:hover { border-color: var(--blue-mid); color: var(--blue); }
  .chip.active { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 500; }
  .chip .n { font-size: 11px; opacity: .75; margin-left: 3px; }

  /* ===== 主体 ===== */
  main { max-width: 1100px; margin: 0 auto; padding: 22px 20px 60px; }
  .cat-section { margin-bottom: 34px; }
  .cat-title {
    display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
    font-size: 16px; font-weight: 600; color: var(--blue);
  }
  .cat-title::before { content: ""; width: 4px; height: 18px; border-radius: 2px; background: var(--blue-mid); }
  .cat-title .hint { font-size: 12px; font-weight: 400; color: var(--text-2); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }

  /* 快捷键卡片 */
  .card {
    background: #fff; border: 1px solid var(--card-border); border-radius: 14px;
    padding: 14px 16px 12px; position: relative;
    transition: box-shadow .15s, transform .15s;
  }
  .card:hover { box-shadow: 0 6px 20px rgba(24,95,165,.10); transform: translateY(-1px); }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .fname { font-family: var(--sans); font-size: 15px; font-weight: 600; color: var(--blue); }
  .star {
    background: none; border: none; cursor: pointer; font-size: 18px; line-height: 1;
    color: #C7D3DE; padding: 2px 4px; transition: color .15s, transform .15s;
  }
  .star:hover { color: var(--blue-mid); transform: scale(1.15); }
  .star.faved { color: #F0A92E; }
  .keys {
    font-family: var(--mono); font-size: 13px; background: var(--blue-bg-soft);
    border: 1px solid rgba(24,95,165,.10); color: #0C447C;
    padding: 8px 10px; border-radius: 8px; margin-bottom: 8px;
    overflow-x: auto; white-space: nowrap; scrollbar-width: thin;
    display: flex; align-items: center; flex-wrap: nowrap;
  }
  .keys kbd {
    font-family: var(--mono); font-size: 12px; background: #fff;
    border: 1px solid var(--card-border); border-bottom-width: 2px;
    border-radius: 6px; padding: 2px 7px; color: var(--blue); white-space: nowrap;
  }
  .keys .plus { color: var(--blue-mid); margin: 0 4px; font-weight: 600; flex: 0 0 auto; }
  .desc { font-size: 13.5px; color: var(--text); margin-bottom: 8px; }
  .copy-btn {
    position: absolute; right: 12px; bottom: 10px;
    font-size: 11px; color: var(--blue); background: var(--blue-bg);
    border: none; border-radius: 6px; padding: 3px 9px; cursor: pointer;
    opacity: 0; transition: opacity .15s; font-family: var(--sans);
  }
  .card:hover .copy-btn { opacity: 1; }
  @media (hover: none) { .copy-btn { opacity: 1; } }

  /* 空结果 */
  .empty {
    display: none; text-align: center; padding: 60px 20px; color: var(--text-2);
  }
  .empty .big { font-size: 40px; margin-bottom: 10px; }

  /* 高频必记区 */
  .shortcut-box {
    background: linear-gradient(135deg, #EAF3FC 0%, #F4F9FE 100%);
    border: 1px solid var(--card-border); border-radius: 16px; padding: 18px 20px;
  }
  .shortcut-box h2 { font-size: 16px; font-weight: 600; color: var(--blue); margin-bottom: 12px; }
  .sc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px 20px; }
  .sc-item { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text); }
  .sc-item kbd {
    font-family: var(--mono); font-size: 11.5px; background: #fff;
    border: 1px solid var(--card-border); border-bottom-width: 2px;
    border-radius: 6px; padding: 2px 7px; color: var(--blue); white-space: nowrap;
  }
  .sc-item .plus { color: var(--blue-mid); margin: 0 2px; font-weight: 600; }

  footer {
    text-align: center; font-size: 12px; color: var(--text-2);
    padding: 24px 20px 40px; line-height: 2;
  }
  footer b { color: var(--blue); font-weight: 500; }
  footer a { color: var(--blue); text-decoration: none; border-bottom: 1px dashed var(--blue-mid); }

  @media (max-width: 640px) {
    header { padding: 10px 14px 8px; }
    main { padding: 16px 14px 50px; }
    h1 { font-size: 18px; }
    .grid { grid-template-columns: 1fr; }
    .title-row { gap: 4px; margin-bottom: 8px; }
    .subtitle { font-size: 12px; }
    #search { font-size: 16px; padding: 10px 12px 10px 38px; }
    .chips { flex-wrap: nowrap; overflow-x: auto; gap: 6px; padding-bottom: 4px; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
    .card { padding: 14px 14px 16px; }
    .card h3 { font-size: 15px; }
    .desc { font-size: 13.5px; }
    .keys { font-size: 12px; }
    footer { padding: 22px 16px 40px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="title-row">
      <h1>快捷键速查手册</h1>
      <span class="count-badge" id="totalBadge"></span>
      <span class="subtitle">系统 · 文件 · 文本 · Excel · Word · PPT · 浏览器</span>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search" type="text" placeholder="搜索快捷键，如：求和、截图、刷新、居中、复制、放映…" autocomplete="off">
    </div>
    <div class="chips" id="chips"></div>
  </div>
</header>

<main id="main"></main>

<div class="empty" id="empty">
  <div class="big">⌕</div>
  <div>没搜到相关快捷键，换个关键词试试？</div>
  <div style="font-size:12px;margin-top:6px;">比如搜「求和」「居中」「截图」「刷新」「放映」「复制」这类动作词</div>
</div>

<main style="padding-top:0;">
  <div class="shortcut-box">
    <h2>先记这 8 个万能键，效率直接起飞</h2>
    <div class="sc-grid">
      <div class="sc-item"><kbd>Ctrl</kbd><span class="plus">+</span><kbd>C</kbd>复制</div>
      <div class="sc-item"><kbd>Ctrl</kbd><span class="plus">+</span><kbd>V</kbd>粘贴</div>
      <div class="sc-item"><kbd>Ctrl</kbd><span class="plus">+</span><kbd>Z</kbd>撤销</div>
      <div class="sc-item"><kbd>Ctrl</kbd><span class="plus">+</span><kbd>A</kbd>全选</div>
      <div class="sc-item"><kbd>Ctrl</kbd><span class="plus">+</span><kbd>F</kbd>查找</div>

    </div>
  </div>
</main>

<footer>
  <div><b>使用方法：</b>遇到重复性操作，先来这里搜一下有没有对应快捷键，养成肌肉记忆</div>
  <div>配套手册：<a href="Excel%E5%87%BD%E6%95%B0%E9%80%9F%E6%9F%A5%E6%89%8B%E5%86%8C.html">Excel 函数速查手册</a> · <a href="SQL%E9%80%9F%E6%9F%A5%E6%89%8B%E5%86%8C.html">SQL 速查手册</a> · <a href="PowerQuery%E9%80%9F%E6%9F%A5%E6%89%8B%E5%86%8C.html">Power Query 速查手册</a></div>
</footer>

// ===== 渲染 =====
const main = document.getElementById("main");
const chipsEl = document.getElementById("chips");
const emptyEl = document.getElementById("empty");
const totalBadge = document.getElementById("totalBadge");
const FAV_KEY = "shortcut-handbook-favs";
let favs = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || "[]"));
let activeChip = "all";
let keyword = "";

function saveFavs() { localStorage.setItem(FAV_KEY, JSON.stringify([...favs])); }
function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function uid(f) { return f.cat + "::" + f.key; }
function keyChips(key) {
  return key.split("+").map(k => k.trim()).filter(k => k).map(k => `<kbd>${esc(k)}</kbd>`).join('<span class="plus">+</span>');
}

function buildChips() {
  const all = [{ id:"all", name:"全部" }, ...CATS, { id:"fav", name:"★ 已收藏" }];
  chipsEl.innerHTML = all.map(c => {
    const n = c.id === "all" ? SC.length
      : c.id === "fav" ? favs.size
      : SC.filter(f => f.cat === c.id).length;
    return `<button class="chip${activeChip===c.id?" active":""}" data-id="${c.id}">${c.name}<span class="n">${n}</span></button>`;
  }).join("");
}

function match(f) {
  if (activeChip === "fav" && !favs.has(uid(f))) return false;
  if (activeChip !== "all" && activeChip !== "fav" && f.cat !== activeChip) return false;
  if (keyword) {
    const hay = (f.name + " " + f.key + " " + f.desc + " " + (CATNAME[f.cat]||"")).toLowerCase();
    if (!hay.includes(keyword)) return false;
  }
  return true;
}

function render() {
  buildChips();
  totalBadge.textContent = "共 " + SC.length + " 个快捷键";
  let html = "";
  CATS.forEach(c => {
    const list = SC.filter(f => f.cat === c.id && match(f));
    if (!list.length) return;
    html += `<section class="cat-section">
      <div class="cat-title">${c.name}<span class="hint">${c.hint}</span></div>
      <div class="grid">${list.map(cardHTML).join("")}</div>
    </section>`;
  });
  main.innerHTML = html;
  emptyEl.style.display = html ? "none" : "block";
}

function cardHTML(f) {
  const faved = favs.has(uid(f));
  return `<div class="card" data-uid="${esc(uid(f))}">
    <div class="card-head">
      <span class="fname">${esc(f.name)}</span>
      <button class="star${faved?" faved":""}" title="${faved?"取消收藏":"收藏"}">${faved?"★":"☆"}</button>
    </div>
    <div class="keys">${keyChips(f.key)}</div>
    <div class="desc">${esc(f.desc)}</div>
    <button class="copy-btn">复制快捷键</button>
  </div>`;
}

// ===== 交互 =====
chipsEl.addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  activeChip = chip.dataset.id;
  render();
});

document.getElementById("search").addEventListener("input", e => {
  keyword = e.target.value.trim().toLowerCase();
  render();
});

main.addEventListener("click", e => {
  const star = e.target.closest(".star");
  const copyBtn = e.target.closest(".copy-btn");
  if (star) {
    const id = star.closest(".card").dataset.uid;
    favs.has(id) ? favs.delete(id) : favs.add(id);
    saveFavs();
    render();
    return;
  }
  if (copyBtn) {
    const card = copyBtn.closest(".card");
    const key = card.dataset.uid.split("::").slice(1).join("::");
    navigator.clipboard.writeText(key).then(() => {
      copyBtn.textContent = "已复制";
      setTimeout(() => copyBtn.textContent = "复制快捷键", 1200);
    }).catch(() => {
      const ta = document.createElement("textarea");
      ta.value = key; document.body.appendChild(ta);
      ta.select(); document.execCommand("copy"); ta.remove();
      copyBtn.textContent = "已复制";
      setTimeout(() => copyBtn.textContent = "复制快捷键", 1200);
    });
  }
});

render();
</script>
